# Пример настроек для: bash ubuntu_hardening.sh --config example.conf [--yes]
# Формат КЛЮЧ=значение; кавычки необязательны; файл НЕ выполняется (не source).
# Пустое значение или отсутствующий ключ — значение по умолчанию из скрипта.
# Храните файл с правами 600: в нём хеш пароля.

ADMIN_USER=opsadm
SSH_PORT=22022

# Ключ: root (из /root/.ssh/authorized_keys) или provided (+ SSH_PUBKEY)
SSH_KEY_SOURCE=provided
SSH_PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA...замените... me@laptop"

# Обязателен для --yes, если у администратора ещё нет пароля (нужен для sudo):
#   openssl passwd -6
ADMIN_PASSWORD_HASH=''

NEW_HOSTNAME=web01
NEW_FQDN=web01.example.com
TIMEZONE=Europe/Moscow
DNS_SERVERS="1.1.1.1 1.0.0.1"
NTP_SERVERS=""

# UFW: порты сервера и (при Docker) порты контейнеров, открытые извне
EXTRA_PORTS="80 443"
DOCKER_ALLOW_PORTS=auto
FAIL2BAN_IGNOREIP=""

# auto | yes | no
IP_FORWARD=auto
DOCKER_UFW_FIX=auto
TMP_MODE=auto
IPV6_ACCEPT_RA=auto
HOME_NOEXEC=yes

# Необязательные меры
ENABLE_FAILLOCK=no
ENABLE_AIDE=no
KERNEL_CMDLINE_HARDENING=no
HIDEPID=no
REMOTE_SYSLOG=""
DISABLE_SERVICES="cups avahi-daemon"
